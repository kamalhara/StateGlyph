name: Feature request
description: Suggest an improvement for StateGlyph
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or use case should this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, behavior, or documentation you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you considered?
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, mockups, or links that help explain the request.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues for similar requests.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
